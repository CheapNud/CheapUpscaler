name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    # Windows runner required: net11.0-windows desktop target; host SDK is used
    # deliberately - actions/setup-dotnet triggers a firewall/UAC prompt that wedges the job
    runs-on: windows
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore CheapUpscaler.slnx

      - name: Build
        run: dotnet build CheapUpscaler.slnx --no-restore --configuration Release
