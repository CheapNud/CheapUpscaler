name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build and publish release
    # Windows runner required: net11.0-windows desktop target; host SDK is used
    # deliberately - actions/setup-dotnet triggers a firewall/UAC prompt that wedges the job
    runs-on: windows
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, package, and publish to Forgejo
        # cmd + explicit -File bypass instead of the runner's powershell step wrapper:
        # the runner executes as SYSTEM, whose effective execution policy is
        # Restricted and blocks the generated wrapper scripts. The release
        # logic lives in deploy/release.ps1 and reads its inputs from env.
        shell: cmd
        env:
          REF_NAME: ${{ github.ref_name }}
          FORGE_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deploy/release.ps1
